  .about-selected-publications ol.bibliography .about-publication-meta .links a.btn {

  .author-toggle {
    display: inline;

    .project-grid {

  @media (max-width: 767px) {
    .about-lead {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 1rem;
    }
    .about-lead .post-header {
      margin: 0;
    }
    .about-lead .profile {
      grid-column: 1;
      grid-row: 2;
      float: none !important;
      margin: 0 !important;
      justify-self: center;
      width: 190px !important;
    }
    .about-summary {
      grid-column: 1 / -1;
      grid-row: 3;
    }
    .post-header .post-title {
      font-size: 2rem;
    }
    .profile-heading {
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    }
    .about-publication-entry {

  @media (max-width: 540px) {
    .post-header .desc {
      font-size: 0.875rem;
    }
    .header-contact {
      font-size: 0.825rem;
    }

      grid-template-columns: minmax(0, 1fr);

      grid-template-columns: minmax(0, 1fr);

</style>
<script>
  (() => {
    const brand = document.querySelector(".home-scroll-brand");
    const heading = document.querySelector(".post-header .post-title");
    if (brand && heading) {
      const observer = new IntersectionObserver(
        ([entry]) => {
          brand.classList.toggle("is-visible", !entry.isIntersecting);
          brand.setAttribute("aria-hidden", String(entry.isIntersecting));
        },
        { rootMargin: "-57px 0px 0px" }
      );
      observer.observe(heading);
    }

    document.addEventListener("click", (event) => {
      const toggle = event.target.closest(".author-toggle");
      if (!toggle) return;
      const expanded = toggle.getAttribute("aria-expanded") === "true";
      document.getElementById(toggle.getAttribute("aria-controls")).hidden = expanded;
      toggle.setAttribute("aria-expanded", String(!expanded));
      toggle.textContent = expanded ? toggle.dataset.collapsedLabel : toggle.dataset.expandedLabel;
    });
  })();
</script>
