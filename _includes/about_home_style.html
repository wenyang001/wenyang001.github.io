<style>

  }

  article .profile,
  article .profile div,
  article .profile figure {
    width: 210px !important;
    max-width: 210px !important;
    background: transparent !important;
  }

  article .profile {
    float: right !important;

  .news {

  .news table th {

    color: var(--global-text-color-light);

  }

  .news table td {

  }

  .zh-news-list {

  .education-item strong {

  .zh-paper-meta {

    font-size: 0.9em;
  }

  .project-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 0.8rem;
    margin: 0 0 0.75rem;
  }

  .project-item {
    position: relative;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 204px;
    padding: 0.9rem 0.95rem 0.85rem;
    border: 1px solid var(--global-divider-color);
    border-radius: 6px;
    background: var(--global-bg-color);
  }

  .project-item.is-current {
    border-color: rgba(181, 9, 172, 0.38);
  }

  .project-item.is-current::before {
    position: absolute;
    top: -1px;
    right: -1px;
    left: -1px;
    height: 3px;
    border-radius: 6px 6px 0 0;

    content: "";

  .project-item time {
    display: block;
    margin-bottom: 0.42rem;
    color: var(--global-theme-color);
    font-size: 0.78rem;
    font-weight: 600;
    line-height: 1.3;
    white-space: nowrap;
  }

  .project-item h3 {
    margin: 0 0 0.38rem;
    overflow: hidden;
    font-size: 0.82rem;
    font-weight: 600;
    line-height: 1.3;
    white-space: nowrap;
    text-overflow: ellipsis;
  }

  .project-item p {
    margin: 0;
    color: var(--global-text-color-light);
    font-size: 0.82rem;
    line-height: 1.42;
  }

  .project-item .project-summary {
    margin-top: 0.38rem;
    min-height: calc(4 * 1.45em);
    color: var(--global-text-color);
    font-size: 0.78rem;
    line-height: 1.45;
  }

  .project-outputs {
    display: flex;
    flex-wrap: wrap;
    gap: 0.2rem;
    margin-top: auto;
    padding-top: 0.7rem;
  }

  .project-outputs span {
    display: inline-block;
    padding: 0.14rem 0.38rem;
    border-radius: 3px;
    background: rgba(181, 9, 172, 0.07);
    color: var(--global-theme-color);
    font-size: 0.72rem;
    font-weight: 550;
    line-height: 1.35;
  }

  @media (max-width: 767px) {
    .post-header .post-title {
      font-size: 2.2rem;
    }

    .post-header .desc {
      font-size: 0.92rem;
    }

    article .profile,
    article .profile div,
    article .profile figure {
      float: none !important;
      width: min(190px, 100%) !important;
      max-width: min(190px, 100%) !important;
      margin: 0 auto 1.25rem !important;
    }

    article .profile img,
    article .profile picture img,
    article .profile img.img-fluid,
    article .profile img.z-depth-1 {
      max-width: 190px !important;
    }

    article .profile .more-info,
    article .profile .more-info p {
      text-align: center;
    }

    .news table,
    .news tbody,
    .news tr,
    .news th,
    .news td {
      display: block;
      width: 100% !important;
    }

    .news table tr {
      margin-bottom: 0.75rem;
    }

    .news table th,
    .news table td {
      padding-right: 0;
      padding-left: 0;
    }

    .news table th {
      padding-bottom: 0.08rem;
    }

    .zh-news-item {
      grid-template-columns: minmax(0, 1fr);
      gap: 0.1rem;
    }

    .project-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 540px) {
    .project-grid {
      grid-template-columns: minmax(0, 1fr);
    }

    .project-item {
      min-height: 0;
    }

    .project-outputs {
      margin-top: 0.5rem;
      padding-top: 0;
    }

  }
</style>

<script>
  (() => {
    const brand = document.querySelector(".home-scroll-brand");
    const heading = document.querySelector(".post-header .post-title");

    if (!brand || !heading) return;

    const setVisible = (visible) => {
      brand.classList.toggle("is-visible", visible);
      brand.setAttribute("aria-hidden", String(!visible));
    };

    const observer = new IntersectionObserver(([entry]) => setVisible(!entry.isIntersecting), {
      rootMargin: "-57px 0px 0px",
    });

    observer.observe(heading);
  })();
</script>
